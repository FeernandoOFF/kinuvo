product: jvm/app

dependencies:
  - ../../client/ui
  - ../../server/jvm
  - ../../libs/diagnostics
  - ../../libs/tailcat
  - ../../plugins/cua
  - dev.nucleusframework:composenativetray:2.1.7
  - $compose.desktop.currentOs
  - dev.nucleusframework:nucleus.nucleus-application:3.0.0-dev-202611161221
  - dev.nucleusframework:nucleus.decorated-window-tao:3.0.0-dev-202611161221

test-dependencies:
  - $kotlin.test

repositories:
  - https://packages.jetbrains.team/maven/p/ij/intellij-dependencies

settings:
  compose:
    enabled: true
    version: 1.12.1
  kotlin:
    compileIncrementally: true
    serialization: json
  jvm:
    jdk:
      distributions: [jetbrains]
    mainClass: kinuvo.desktop.MainKt
