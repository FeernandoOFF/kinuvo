# On-device models through LiteRT-LM, downloaded and run by the Server.
product:
  type: kmp/lib
  platforms: [jvm, android]

dependencies:
  - ../../core: exported
  - ../../models
  - ai.koog:prompt-executor-openai-client:1.3.0

dependencies@jvm:
  - com.google.ai.edge.litertlm:litertlm-jvm:0.19.0

dependencies@android:
  - com.google.ai.edge.litertlm:litertlm-android:0.19.0

test-dependencies:
  - ../../testing
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
