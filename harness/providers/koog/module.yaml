product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]

dependencies:
  - ../../core: exported
  - ai.koog:prompt-executor-openai-client:1.3.0
  - ai.koog:http-client-ktor:1.3.0
  - io.ktor:ktor-client-content-negotiation:3.6.0
  - io.ktor:ktor-serialization-kotlinx-json:3.6.0

dependencies@jvm:
  - io.ktor:ktor-client-java:3.6.0

dependencies@android:
  - io.ktor:ktor-client-okhttp:3.6.0

dependencies@ios:
  - io.ktor:ktor-client-darwin:3.6.0

test-dependencies:
  - ../../testing
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
  - io.ktor:ktor-client-mock:3.6.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
