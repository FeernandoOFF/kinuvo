product:
  type: kmp/lib
  platforms: [jvm, android]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../api
  - com.agentclientprotocol:acp:0.33.0

settings:
  jvm:
    test:
      systemProperties:
        java.io.tmpdir: ../../build
  kotlin:
    serialization: json

test-dependencies:
  - $kotlin.test

test-dependencies@jvm:
  - ../../testing/harness-testing
  - org.slf4j:slf4j-api:2.0.17
