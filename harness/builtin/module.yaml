# The built-in harness: Koog agent loop, model building, compaction and the native execution session.
# Standalone: depends on protocol and the execution contracts only, never on Server modules.
product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../api: exported
  - ../../protocol: exported
  - co.touchlab:stately-concurrent-collections:2.1.0
  - ai.koog:agents-tools:1.3.0: exported
  - ai.koog:agents-core:1.3.0: exported
  - ai.koog:prompt-executor-model:1.3.0: exported
  - ai.koog:prompt-executor-clients:1.3.0: exported
  - ai.koog:prompt-model:1.3.0: exported
  - ai.koog:prompt-llm:1.3.0: exported
  - $kotlin.serialization.json: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0: exported
  - org.jetbrains.kotlinx:kotlinx-datetime:0.8.0: exported
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.1: exported
  - io.ktor:ktor-client-core:3.6.0: exported
  - io.github.oshai:kotlin-logging:8.0.4: exported

dependencies@jvmAndAndroid:
  - ai.koog:agents-features-opentelemetry:1.3.0
  - io.opentelemetry:opentelemetry-exporter-logging-otlp:1.61.0

test-dependencies:
  - ../../testing/harness-testing
  - io.ktor:ktor-client-mock:3.6.0
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
