product:
  type: kmp/lib
  platforms: [jvm, android]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../../server/plugin-api: exported

dependencies@jvm:
  - dev.kdriver:core:0.6.1

test-dependencies:
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  jvm:
    test:
      systemProperties:
        java.io.tmpdir: ../../build
  kotlin:
    compileIncrementally: true
    serialization: json

test-dependencies@jvm:
  - ../../testing/harness-testing
