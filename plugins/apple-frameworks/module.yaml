# Apple Reminders and Calendar (EventKit) as a Task provider and Agent tools on macOS and iPhone Servers; the Swift core is in native/.
product:
  type: kmp/lib
  platforms: [jvm, iosArm64, iosSimulatorArm64]

dependencies:
  - ../../server/plugin-api: exported

test-dependencies:
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
