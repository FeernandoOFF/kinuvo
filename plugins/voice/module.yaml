# Speech models downloaded to the Server and run by a native worker, offered as the Server's voice.
product: jvm/lib

dependencies:
  - ../../server/plugin-api: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0

test-dependencies:
  - ../../testing/harness-testing
  - $kotlin.test

settings:
  jvm:
    test:
      systemProperties:
        java.io.tmpdir: ../../build
  kotlin:
    serialization: json
