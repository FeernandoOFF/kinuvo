# Todoist as a task provider, through its API and a personal API token; set up in Settings → Tasks.
product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]

dependencies:
  - ../../server/plugin-api: exported

test-dependencies:
  - $kotlin.test
  - io.ktor:ktor-client-mock:3.6.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
