# Bitwarden Secrets Manager for Secret references (`${bws://…}`), through the bws CLI and a machine account access token.
product: jvm/lib

dependencies:
  - ../../server/plugin-api: exported

test-dependencies:
  - ../../testing/harness-testing
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  jvm:
    test:
      systemProperties:
        java.io.tmpdir: ../../build
  kotlin:
    compileIncrementally: true
    serialization: json
