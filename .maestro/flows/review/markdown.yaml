appId: ${APP_ID}
tags:
  - android
  - ios
  - smoke
  - regression
properties:
  apiProfile: showcase
---
- runFlow:
    file: ../../shared/review-pair.yaml
    env:
      PAIRING_CODE: "123456"
- extendedWaitUntil:
    visible: "Agents and sessions"
    timeout: 30000
- tapOn: "Agents and sessions"
- extendedWaitUntil:
    visible: "Release notes review for the 2.0 launch.*"
    timeout: 60000
- tapOn: "Release notes review for the 2.0 launch.*"
- extendedWaitUntil:
    visible: "Message"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Markdown review"
    direction: UP
    timeout: 30000
    centerElement: true
- swipe:
    start: 50%,75%
    end: 50%,30%
    duration: 500
- takeScreenshot: 00-heading
- takeScreenshot: 01-chat-top
- swipe:
    start: 50%,75%
    end: 50%,35%
    duration: 500
- takeScreenshot: 02-lists-code
- swipe:
    start: 50%,75%
    end: 50%,35%
    duration: 500
- takeScreenshot: 02b-tasks-code
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 50%,72%
          end: 50%,30%
          duration: 500
- scrollUntilVisible:
    element:
      text: "Wide table"
    direction: DOWN
    timeout: 90000
    waitToSettleTimeoutMs: 500
    centerElement: false
- scrollUntilVisible:
    element:
      text: "End of Markdown review.*"
    direction: DOWN
    timeout: 30000
    waitToSettleTimeoutMs: 500
    centerElement: true
- takeScreenshot: 03-table
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 85%,45%
          end: 15%,45%
          duration: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 75%,45%
          end: 5%,45%
          duration: 500
- assertVisible: "Notes.*"
- assertVisible: "This intentionally long cell.*"
- assertVisible: "Dimmed markers.*"
- takeScreenshot: 03b-table-swipe
- tapOn: "Message"
