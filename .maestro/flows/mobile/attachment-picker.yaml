appId: ${APP_ID}
tags:
  - regression
  - android
  - ios
properties:
  apiProfile: mobile-attachments
  apiVerifications:
    - stub: mobile/attachment-capabilities
      atLeast: 1
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Attach"
- assertVisible:
    text: "Photos"
    enabled: true
- assertVisible:
    text: "Files"
    enabled: true
- tapOn: "Files"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Browse"
      - tapOn:
          text: "Cancel"
          index: 1
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Recent"
      - back
- assertVisible: "Message"
