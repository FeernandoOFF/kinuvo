appId: ${APP_ID}
tags:
  - regression
  - android
  - ios
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Attach"
- assertVisible:
    text: "Photos"
    enabled: true
- assertVisible:
    text: "Files"
    enabled: true
- tapOn: "Files"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Cancel"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Recent"
      - back
      - assertVisible: "Message"
