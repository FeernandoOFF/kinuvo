appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
properties:
  apiProfile: mobile-computers
  apiVerifications:
    - stub: mobile/computers
      atLeast: 1
    - stub: mobile/computer-watch
      atLeast: 1
    - stub: mobile/computer-take
      exactly: 1
    - stub: mobile/computer-home
      exactly: 1
    - stub: mobile/computer-hand-back
      exactly: 1
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Agents and sessions"
- tapOn:
    text: "Home"
    above: "New agent"
- tapOn: "Computers"
- runFlow: ../../shared/assert-no-back.yaml
- assertVisible: "Watching"
- tapOn: "Pixel"
- assertVisible: "Watching"
- tapOn: "Take over"
- runScript:
    file: ../../shared/set-computer-holder.js
    env:
      HOLDER: "e2e-device"
      PRIORITY: "1"
- runScript:
    file: ../../shared/send-message.js
    env:
      WS_PATH: /ws
      WS_MESSAGE: '{"type":"event","event":"screens.changed","payload":null,"seq":100}'
- runScript:
    file: ../../shared/send-message.js
    env:
      WS_PATH: /ws
      WS_MESSAGE: '{"type":"event","event":"screens.frame","seq":102,"payload":{"screen":{"source":"computer","id":"phone"},"subscription":"computer-sub","epoch":"computer-epoch","sequence":2,"sample":{"image":"","width":128,"height":80,"geometry":"fixture"}}}'
- assertVisible: "In control"
- tapOn: "Keys"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Home"
          childOf:
            id: "android:id/content"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Home"
- tapOn: "Hand back"
- runScript:
    file: ../../shared/set-computer-holder.js
    env:
      HOLDER: ""
      PRIORITY: "0"
- runScript:
    file: ../../shared/send-message.js
    env:
      WS_PATH: /ws
      WS_MESSAGE: '{"type":"event","event":"screens.changed","payload":null,"seq":101}'
- assertVisible: "Watching"
