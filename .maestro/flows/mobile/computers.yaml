appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
properties:
  apiProfile: mobile-computers
  apiVerifications:
    - stub: mobile/computers
      atLeast: 1
    - stub: mobile/computer-watch
      atLeast: 1
    - stub: mobile/computer-take
      exactly: 1
    - stub: mobile/computer-home
      exactly: 1
    - stub: mobile/computer-hand-back
      exactly: 1
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Agents and sessions"
- tapOn:
    text: "Home"
    above: "New agent"
- tapOn: "Computers"
- runFlow: ../../shared/assert-no-back.yaml
- tapOn: "Pixel"
- assertVisible: "Idle"
- assertVisible: "Waiting for the screen…"
- runScript:
    file: ../../shared/send-message.js
    env:
      WS_PATH: /ws
      WS_MESSAGE: '{"type":"event","event":"computer.frame","payload":{"computer":{"id":"phone","name":"Pixel","platform":"Android","available":true,"control":"Idle"},"screen":{"capture":"frame","width":54,"height":120,"screenshot":""}},"seq":30}'
- assertVisible: "Screen of Pixel"
- tapOn: "Take over"
- assertVisible: "You're in control"
- tapOn:
    text: "Home"
    above: "Type into the focused field"
- tapOn: "Hand back"
- assertVisible: "Idle"
