appId: ${APP_ID}
tags:
  - regression
  - android
  - ios
properties:
  apiProfile: mobile-voice
  apiVerifications:
    - stub: mobile/voice-capabilities
      atLeast: 1
---
- launchApp:
    permissions:
      all: allow
- runFlow: ../../shared/pair-mobile.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Voice chat"
      - tapOn: "Pause"
      - runFlow:
          when:
            notVisible: "The microphone has no usable.*"
          commands:
            - assertVisible: "Paused · hold to talk"
            - tapOn: "Resume"
            - assertVisible: "Listening"
      - tapOn: "End voice chat"
      - assertVisible: "Message"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Voice chat (coming soon)"
