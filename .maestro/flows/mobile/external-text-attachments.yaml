appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Attach"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          enabled: false
          containsChild:
            text: "Photos"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          text: "Photos"
          enabled: false
- runFlow: ../../shared/check-external-files.yaml
