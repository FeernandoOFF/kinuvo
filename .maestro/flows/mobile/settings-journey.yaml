- takeScreenshot: 01-chat-before-swipe
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 8%,50%
          end: 80%,50%
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%,50%
          end: 80%,50%
- assertVisible:
    text: "Home"
    above: "New agent"
- assertVisible: "E2E Agent"
- assertVisible: "New agent"
- assertVisible: "Server: .*"
- assertVisible: "Settings"
- assertVisible: "Search sessions"
- assertVisible: "Agent settings"
