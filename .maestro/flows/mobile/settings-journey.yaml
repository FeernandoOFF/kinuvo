appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
properties:
  apiProfile: mobile-settings-journey
  apiVerifications:
    - stub: mobile/connect-settings
      exactly: 1
    - stub: ws/create-session
      exactly: 1
    - stub: ws/chat-send
      exactly: 1
    - stub: mobile/agent-update
      exactly: 1
    - stub: mobile/settings-skill-save
      exactly: 1
    - stub: mobile/server-rules
      atLeast: 1
    - stub: mobile/providers
      atLeast: 1
    - stub: mobile/harnesses
      atLeast: 1
