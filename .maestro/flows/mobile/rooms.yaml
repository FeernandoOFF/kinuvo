appId: ${APP_ID}
tags:
  - android
  - ios
  - smoke
  - regression
properties:
  apiProfile: mobile-rooms
  apiVerifications:
    - stub: mobile/rooms
      atLeast: 1
    - stub: mobile/room-sessions
      atLeast: 1
    - stub: mobile/room-session
      atLeast: 1
    - stub: mobile/room-create-session
      exactly: 1
    - stub: mobile/room-send
      exactly: 1
---
- runFlow: ../../shared/pair-mobile.yaml
- tapOn: "Agents and sessions"
- tapOn: "Rooms"
- tapOn: "Garden team"
- assertVisible: "Plan the garden"
- assertVisible: "The materials list is ready."
- tapOn: "New Session"
- tapOn: "@E2E Agent"
- tapOn: "Message this Room"
- inputText: "Check the plan"
- assertVisible: "Check the plan"
- scrollUntilVisible:
    element:
      text: "Send"
    direction: DOWN
- takeScreenshot: rooms-recipient
- tapOn: "Send"
- assertNotVisible: "Check the plan"
