appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
properties:
  apiProfile: mobile-providers
  apiVerifications:
    - stub: mobile/providers
      atLeast: 1
---
- launchApp
- assertVisible: "Connect a server"
- tapOn: "From kinuvo pair"
- inputText: "123456"
- hideKeyboard
- runFlow:
    when:
      visible: "Connect"
    commands:
      - tapOn: "Connect"
- assertVisible: "Start a session with E2E Agent"
- tapOn: "Agents and sessions"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Model providers"
    direction: DOWN
- tapOn: "Model providers"
- assertVisible: "Hosted models"
- assertVisible: "API key required"
- takeScreenshot: providers-api-keys
- scrollUntilVisible:
    element:
      text: "Local models"
    direction: DOWN
- assertVisible: "No sign-in needed"
- takeScreenshot: providers-local-endpoints
