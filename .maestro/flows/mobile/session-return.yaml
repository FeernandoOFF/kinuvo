appId: ${APP_ID}
tags:
  - android
  - ios
  - regression
---
- runFlow: ../../shared/start-chat.yaml
- tapOn: "Agents and sessions"
- tapOn:
    text: "Home"
    above: "New agent"
- tapOn: "Board"
- assertVisible: "Plan mobile tests"
- runFlow: ../../shared/assert-no-back.yaml
- runFlow: ../../shared/return-to-chat.yaml
- assertVisible: "Hello from Maestro"
- assertVisible: "Hello from the fixture Server"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Home
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.apple.Preferences
- launchApp:
    stopApp: false
- assertVisible: "Hello from Maestro"
- assertVisible: "Hello from the fixture Server"
