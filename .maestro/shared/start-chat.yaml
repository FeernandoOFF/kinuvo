appId: ${APP_ID}
---
- runFlow: pair-mobile.yaml
- tapOn: "Message"
- inputText: "Hello from Maestro"
- tapOn: "Send"
# Dismiss the composer keyboard with a normal tap in the conversation area.
- tapOn:
    point: 90%,45%
- extendedWaitUntil:
    visible: "Hello from the fixture Server"
    timeout: 20000
- tapOn: "Hello from the fixture Server"
