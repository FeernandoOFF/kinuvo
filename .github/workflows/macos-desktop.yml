name: macOS desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version (does not publish a release)'
        type: string
        default: '1.0.0'
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/macos-ci-keychain.sh
      - run: scripts/jbr.sh
      - uses: ./.github/actions/restore-kotlin-cache
      - name: Build, sign and notarize the DMG
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/package.sh desktop "$VERSION"
      - name: Upload accepted DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-15
          path: dist/Kinuvo-*.dmg
          if-no-files-found: error
      - name: Upload notarization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarization
          path: dist/*.notarization*.json
          if-no-files-found: ignore
      - name: Delete temporary signing Keychain
        if: always()
        run: |
          if [ -n "${KINUVO_MACOS_KEYCHAIN:-}" ] && [ -f "$KINUVO_MACOS_KEYCHAIN" ]; then
            security delete-keychain "$KINUVO_MACOS_KEYCHAIN"
          fi
