name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

# Kotlin Toolchain caches are saved by CI on main; tag runs can only restore from there (see .github/actions/restore-kotlin-cache).

jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: scripts/jbr.sh
      - uses: ./.github/actions/restore-kotlin-cache
      - run: scripts/package.sh jar "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/kinuvo.jar

  cli:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: scripts/jbr.sh
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: jar
      - run: scripts/package.sh cli "$VERSION" "$PWD/jar/kinuvo.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runner }}
          path: dist/kinuvo-*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare macOS signing credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}" "${MACOS_CERTIFICATE_P12_BASE64:?}" "${MACOS_CERTIFICATE_PASSWORD:?}"
          : "${APPLE_ID:?}" "${APPLE_TEAM_ID:?}" "${APPLE_APP_SPECIFIC_PASSWORD:?}"
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/kinuvo-signing.XXXXXX")
          keychain="$directory/signing.keychain-db"
          certificate="$directory/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          password=$(openssl rand -hex 32)
          # Save the cleanup path before creating or importing anything.
          printf 'KINUVO_MACOS_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*\) ([0-9A-F]+) "Developer ID Application:.*"/\1/p')
          if [ -z "$identity" ] || [[ "$identity" == *$'\n'* ]]; then
            echo 'Import a .p12 containing exactly one valid Developer ID Application identity and its private key.' >&2
            exit 1
          fi
          printf 'int main(void) { return 0; }\n' > "$directory/probe.c"
          xcrun clang "$directory/probe.c" -o "$directory/probe"
          codesign --force --timestamp --options runtime --sign "$identity" --keychain "$keychain" "$directory/probe"
          codesign --verify --strict "$directory/probe"
          xcrun notarytool store-credentials kinuvo-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          printf 'KINUVO_MACOS_SIGN_IDENTITY=%s\nKINUVO_MACOS_NOTARY_PROFILE=kinuvo-notary\n' "$identity" >> "$GITHUB_ENV"
      - run: scripts/jbr.sh
      - uses: ./.github/actions/restore-kotlin-cache
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: scripts/package.sh desktop "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            dist/Kinuvo-*.dmg
            dist/Kinuvo-*.deb
            dist/Kinuvo-*.zip
          if-no-files-found: error
      - name: Upload notarization reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarization
          path: dist/*.notarization*.json
          if-no-files-found: ignore
      - name: Delete temporary signing Keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${KINUVO_MACOS_KEYCHAIN:-}" ] && [ -f "$KINUVO_MACOS_KEYCHAIN" ]; then
            security delete-keychain "$KINUVO_MACOS_KEYCHAIN"
          fi

  android:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/restore-kotlin-cache
      - name: Build a universal APK signed with the release key
        if: env.KEYSTORE != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i -E \
            -e "s/^    versionName: .*/    versionName: \"${VERSION#v}\"/" \
            -e "s/^    versionCode: .*/    versionCode: $GITHUB_RUN_NUMBER/" apps/android/module.yaml
          ./kotlin package -m android
          aab=$(find build/tasks -name '*-release.aab' | head -1)
          curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo "$KEYSTORE" | base64 -d > release.keystore
          java -jar bundletool.jar build-apks --mode=universal --bundle "$aab" --output app.apks \
            --ks release.keystore --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD"
          mkdir -p dist && unzip -p app.apks universal.apk > dist/Kinuvo-android.apk
          rm release.keystore
      - if: env.KEYSTORE == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the Android APK"
      - if: env.KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Kinuvo-android.apk

  docker:
    needs: jar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [jar, cli, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{jar,cli-*,desktop-*,android}'
          merge-multiple: true
      - run: |
          cp install.sh install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ $VERSION == *-* ]] && echo --prerelease || true)
          gh release create "$VERSION" dist/* --verify-tag --generate-notes $prerelease
