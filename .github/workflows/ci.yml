name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|style|test|docs|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,72}$'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" | grep -vE "^[0-9a-f]+ ${pattern#^}" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit subjects must follow Conventional Commits (see AGENTS.md):"
            echo "$bad"
            exit 1
          fi

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 scripts/test-package-natives.py
          python3 scripts/test-sign-macos.py
          python3 scripts/test-notarize-macos.py
          bash -n scripts/package.sh scripts/notarize-macos.sh scripts/macos-ci-keychain.sh

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui-settings
            cache: ui
            modules: -m ui --include-classes=kinuvo.ui.e2e.SettingsFlowTest --include-classes=kinuvo.ui.e2e.ExternalFlowTest
          - suite: ui-sessions
            cache: ui
            modules: -m ui --include-classes=kinuvo.ui.e2e.SessionFlowTest --include-classes=kinuvo.ui.e2e.ShowcaseFlowTest
          - suite: ui-rest
            cache: ui
            modules: -m ui --exclude-classes=kinuvo.ui.e2e.SettingsFlowTest --exclude-classes=kinuvo.ui.e2e.ExternalFlowTest --exclude-classes=kinuvo.ui.e2e.SessionFlowTest --exclude-classes=kinuvo.ui.e2e.ShowcaseFlowTest
          - suite: server
            cache: server
            modules: -m jvm -m embedded -m core -m browser -m cli
          - suite: rest
            cache: rest
            modules: --exclude-module ui --exclude-module jvm --exclude-module embedded --exclude-module core --exclude-module browser --exclude-module cli
    env:
      MODULES: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@v5
      # The CLI and JDKs are the same for every suite, so one copy is shared; Maven artifacts differ per suite.
      - id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/.cache/JetBrains/Kotlin/extract.cache/*jdk*
            ~/.cache/JetBrains/Kotlin/extract.cache/*jbr*
          key: kotlin-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', '**/*.yaml') }}
          restore-keys: kotlin-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-
      - id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/JetBrains/Kotlin/.m2.cache
          key: kotlin-m2-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('**/*.yaml') }}
          restore-keys: kotlin-m2-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-
      - id: build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('kotlin', '**/*.yaml') }}-${{ github.sha }}
          restore-keys: build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('kotlin', '**/*.yaml') }}-
      # Chromium's sandbox needs unprivileged user namespaces on Ubuntu 24.04.
      - if: matrix.suite == 'server'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run JVM tests
        env:
          RESTORED_BUILD: ${{ steps.build.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          if ! ./kotlin test -p jvm $MODULES 2>&1 | tee "$RUNNER_TEMP/kotlin-tests.log"; then
            if [ -z "$RESTORED_BUILD" ] && ! grep -q "Unable to download checksums" "$RUNNER_TEMP/kotlin-tests.log"; then
              exit 1
            fi
            echo '::warning::Retrying with downloaded metadata and clean build state'
            rm -rf build
            ./kotlin test -p jvm $MODULES
          fi
      - if: always() && matrix.cache == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: ui-flow-screens-${{ matrix.suite }}
          path: client/ui/build/screens/flows
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-logs-${{ matrix.suite }}
          path: build/logs
      - if: github.ref == 'refs/heads/main' && matrix.suite == 'server' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/.cache/JetBrains/Kotlin/extract.cache/*jdk*
            ~/.cache/JetBrains/Kotlin/extract.cache/*jbr*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - if: github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/JetBrains/Kotlin/.m2.cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - if: github.ref == 'refs/heads/main' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.build.outputs.cache-primary-key }}

  test:
    needs: [changes, tests, commits]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.tests.result }}
          COMMITS: ${{ needs.commits.result }}
        run: |
          test "$CHANGES" = success
          test "$COMMITS" = success || test "$COMMITS" = skipped
          test "$CODE" = false || test "$TESTS" = success

  secrets:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-speech:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Build unpackaged desktop speech helper
        shell: powershell
        run: ./scripts/build-windows-speech.ps1
      - name: Run native SAPI synthesis and dictation recognition
        shell: powershell
        run: |
          ./build/KinuvoSpeech.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native speech self-test failed' }
