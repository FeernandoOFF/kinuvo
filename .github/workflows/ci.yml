name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/JetBrains
            ~/Library/Caches/JetBrains
            ~/AppData/Local/JetBrains
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/module.yaml', 'project.yaml') }}
          restore-keys: kotlin-${{ runner.os }}-${{ runner.arch }}-
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs for the browser tests.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./kotlin test -p jvm
      - if: always() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/JetBrains
            ~/Library/Caches/JetBrains
            ~/AppData/Local/JetBrains
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/module.yaml', 'project.yaml') }}

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-speech:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Build unpackaged desktop speech helper
        shell: powershell
        run: ./scripts/build-windows-speech.ps1
      - name: Run native SAPI synthesis and dictation recognition
        shell: powershell
        run: |
          ./build/KinuvoSpeech.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native speech self-test failed' }
