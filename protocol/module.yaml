product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - $kotlin.serialization.json: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0: exported

test-dependencies@jvm:
  - com.networknt:json-schema-validator:1.5.6

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
