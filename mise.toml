[tasks.server]
description = "Run the Server (KINUVO_HOME selects its data)"
run = "./kotlin run -m cli -- serve --host 127.0.0.1"

[tasks.desktop]
description = "Run the desktop app (KINUVO_HOME selects its data)"
run = "./scripts/run-desktop.sh"

[tasks."desktop:personal"]
description = "Run desktop with the personal home (default ~/.kinuvo, port 8787)"
run = 'KINUVO_HOME="${KINUVO_PERSONAL_HOME:-$HOME/.kinuvo}" KINUVO_EMBEDDED_PORT="${KINUVO_PERSONAL_PORT:-8787}" ./scripts/run-desktop.sh'

[tasks."desktop:test"]
description = "Run desktop with the test home (default ~/.kinuvo-test, port 8791)"
run = 'KINUVO_HOME="${KINUVO_TEST_HOME:-$HOME/.kinuvo-test}" KINUVO_EMBEDDED_PORT="${KINUVO_TEST_PORT:-8791}" ./scripts/run-desktop.sh'

[tasks.android]
description = "Build, install and launch the Android app"
run = "./kotlin run -m android"

[tasks.ios]
description = "Build, install and launch the iOS app"
run = "./kotlin run -m ios"

[tasks.cli]
description = "Run CLI commands (KINUVO_HOME selects its data)"
run = "./kotlin run -m cli --"

[tasks.kotlin]
description = "Run Kotlin Toolchain commands"
run = "./kotlin"

[tasks.exec]
description = "Run a command from the checkout root"
run = 'exec "$@"'

[tasks."test:tasks"]
description = "Test mise task arguments and desktop home selection"
run = "python3 scripts/test-mise.py"
