product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs]

aliases:
  - jvmAndMobile: [jvm, android, iosArm64, iosSimulatorArm64]
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../sdk: exported
  - org.jetbrains:markdown:0.7.17: exported
  - dev.ynagai.a2ui:a2ui-core:0.3.0
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.11.0: exported
  - org.jetbrains.kotlinx:kotlinx-datetime:0.8.0
  - io.ktor:ktor-http:3.6.0
  - io.github.xxfast:kstore:1.1.0
  - io.insert-koin:koin-core:4.2.2: exported
  - io.insert-koin:koin-core-viewmodel:4.2.2

dependencies@jvmAndMobile:
  - io.github.xxfast:kstore-file:1.1.0

dependencies@web:
  - io.github.xxfast:kstore-storage:1.1.0
  - org.jetbrains.kotlinx:kotlinx-browser:0.5.0

test-dependencies@jvm:
  - ../../testing/server-testing

test-dependencies:
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
