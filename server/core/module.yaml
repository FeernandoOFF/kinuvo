product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../../harness/api: exported
  - ../../harness/builtin: exported
  - ../plugin-api: exported
  - com.charleskorn.kaml:kaml:0.104.0
  - co.touchlab:stately-concurrency:2.1.0
  - dev.ynagai.a2ui:a2ui-core:0.3.0
  - co.touchlab:stately-concurrent-collections:2.1.0

dependencies@jvmAndAndroid:
  - com.squareup.okhttp3:okhttp:4.12.0
  - io.ktor:ktor-client-cio:3.6.0
  - io.ktor:ktor-server-cio:3.6.0
  - io.ktor:ktor-server-websockets:3.6.0

dependencies@ios:
  - io.ktor:ktor-client-darwin:3.6.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json

test-dependencies@jvm:
  - ../../testing/server-testing

test-dependencies:
  - ../../testing/harness-testing
  - ../../client/sdk
  - ../../client/app
  - io.ktor:ktor-client-mock:3.6.0
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
