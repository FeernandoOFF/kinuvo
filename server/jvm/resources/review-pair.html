<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair with Kinuvo Review</title>
<style>
body{font:18px/1.6 system-ui,sans-serif;max-width:34rem;margin:12vh auto;padding:24px;color:#18262b;background:#f5f7f6}
h1{font-size:2rem;line-height:1.2}a{color:#07594c}#open{display:inline-block;padding:12px 24px;border-radius:12px;background:#07594c;color:white;text-decoration:none}code{overflow-wrap:anywhere;font-size:15px}section{margin:24px 0}small{color:#52615e}
</style>
<h1>Pair with Kinuvo Review</h1>
<p>Open this invite in Kinuvo to connect to the shared fictional demo.</p>
<section id="invite" hidden><a id="open">Open Kinuvo</a></section>
<p>Or enter these details in Kinuvo:</p>
<section>Server<br><code id="server"></code></section>
<section id="code-section" hidden>Pairing code<br><code id="code"></code></section>
<p id="missing">Open the complete pairing invite to include its code.</p>
<small>Demo edits reset daily at 03:00 UTC. Do not enter real personal information.</small>
<script>
const server=location.origin;
document.getElementById('server').textContent=server;
const code=new URLSearchParams(location.hash.slice(1)).get('pair');
if(code && /^[a-zA-Z0-9]{32,64}$/.test(code)) {
  document.getElementById('code').textContent=code;
  document.getElementById('code-section').hidden=false;
  document.getElementById('invite').hidden=false;
  document.getElementById('missing').hidden=true;
  document.getElementById('open').href='kinuvo://pair?server='+encodeURIComponent(server)+'&code='+encodeURIComponent(code);
}
</script>
</html>
