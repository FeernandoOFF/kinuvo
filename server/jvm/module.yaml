# Assembles the engine (Harness) and serves it to clients over WebSocket.
product: jvm/lib

dependencies:
  - ../../harness/builtin: exported
  - ../core: exported
  - ../../harness/acp
  - ../../plugins/browser
  - ../../plugins/anytype
  - ../../plugins/bitwarden
  - ../../plugins/caldav
  - ../../plugins/exec
  - ../../plugins/executor
  - ../../plugins/firecrawl
  - ../../plugins/mcp
  - ../../plugins/ntfy
  - ../../plugins/onepassword
  - ../../plugins/protonpass
  - ../../plugins/reminders
  - ../../plugins/todoist
  - ../../providers/apple
  - ../../providers/codex
  - ../../providers/koog
  - ../../providers/litert
  - ../../plugins/voice
  - ch.qos.logback:logback-classic:1.6.6

test-dependencies:
  - ../../testing/harness-testing
  - ../../testing/server-testing
  - $kotlin.test
  - ../../client/sdk
  - io.ktor:ktor-server-cio:3.6.0
  - io.ktor:ktor-server-websockets:3.6.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
  - app.cash.turbine:turbine:1.2.1

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
