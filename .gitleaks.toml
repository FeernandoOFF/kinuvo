[extend]
useDefault = true

[allowlist]
description = "Not credentials: the desktop launcher marker, RFC 8291 test vectors, generated test keys and Web Push key fields"
regexTarget = "line"
regexes = [
  '''token = '--kinuvo-launch-id=' \+ uuid\.uuid4\(\)\.hex''',
  '''let key: P256\.KeyAgreement\.PrivateKey$''',
]
paths = [
  '''^apps/ios/tests/PushKeysTests\.swift$''',
  '''^relay/push/test/helpers\.ts$''',
]
