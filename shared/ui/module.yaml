product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs]

aliases:
  - jvmAndAndroid: [jvm, android]
  - iosAndWeb: [iosArm64, iosSimulatorArm64, js, wasmJs]

dependencies:
  - ../app: exported
  - $compose.foundation: exported
  - com.composables:ui:0.2.0: exported
  - com.composables:icons-lucide-cmp:2.2.1: exported
  - com.composables:composeunstyled-tooltip:2.7.0
  - com.composables:compose-interaction-capabilities:1.1.0
  - com.composables:ripple-indication:1.1.0
  - com.mohamedrejeb.richeditor:richeditor-compose:1.2.1
  - dev.chrisbanes.haze:haze:2.0.1
  - dev.chrisbanes.haze:haze-blur:2.0.1
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.1.2
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0: exported
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0
  - io.insert-koin:koin-core:4.2.2: exported
  - io.insert-koin:koin-compose-viewmodel:4.2.2
  - org.jetbrains.kotlinx:kotlinx-datetime:0.8.0
  - io.github.alexzhirkevich:qrose:1.3.1

dependencies@jvmAndAndroid:
  - dev.muazkadan:rive-cmp:0.5.0

dependencies@ios:
  - ../../harness/server/embedded
  - ../../harness/providers/apple: exported
  - ../../harness/providers/codex
  - ../../harness/providers/koog
  - ../../harness/plugins/mcp
  - ../../harness/plugins/firecrawl
  - ../../harness/plugins/ntfy
  - ../../harness/plugins/executor
  - ../../harness/plugins/anytype

dependencies@web:
  - org.jetbrains.kotlinx:kotlinx-browser:0.5.0

dependencies@jvm:
  - ../../harness/voice
  - ca.weblite:webview:1.0.10

dependencies@android:
  - ../../harness/server/embedded
  - ../../harness/providers/codex
  - ../../harness/providers/koog
  - ../../harness/plugins/mcp
  - ../../harness/plugins/firecrawl
  - ../../harness/plugins/ntfy
  - ../../harness/plugins/executor
  - ../../harness/plugins/anytype
  - io.insert-koin:koin-android:4.2.2: exported
  - androidx.activity:activity-compose:1.13.0
  - androidx.browser:browser:1.9.0
  - com.google.android.gms:play-services-code-scanner:16.1.0

test-dependencies:
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

test-dependencies@jvm:
  - ../../harness/voice
  - $compose.desktop.currentOs

settings:
  compose:
    enabled: true
    version: 1.12.1
  kotlin:
    compileIncrementally: true
    serialization: json
