product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs]

aliases:
  - jvmAndMobile: [jvm, android, iosArm64, iosSimulatorArm64]
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../protocol: exported
  - io.ktor:ktor-client-core:3.6.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0: exported

dependencies@jvmAndAndroid:
  - io.ktor:ktor-client-cio:3.6.0

dependencies@web:
  - org.jetbrains.kotlinx:kotlinx-browser:0.5.0

dependencies@ios:
  - io.ktor:ktor-client-darwin:3.6.0

test-dependencies:
  - $kotlin.test
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    compileIncrementally: true
    serialization: json
